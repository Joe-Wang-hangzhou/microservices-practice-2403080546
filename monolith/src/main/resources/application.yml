server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: library-monolith
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/library_db}
    username: ${DB_USER:library}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
