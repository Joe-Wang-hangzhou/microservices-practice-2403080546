server:
  port: ${SERVER_PORT:18086}
spring:
  application:
    name: reader-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/reader_db}
    username: ${DB_USER:reader}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health,info
