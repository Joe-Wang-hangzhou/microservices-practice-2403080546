server:
  port: ${SERVER_PORT:18087}
spring:
  application:
    name: book-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/book_db}
    username: ${DB_USER:book}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health,info
