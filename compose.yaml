name: library-week05
services:
  reader-db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: reader_db
      MYSQL_USER: reader
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - reader_data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  reader-service:
    image: library-reader:week06
    build: ./services/reader-service
    ports:
      - "${READER_PORT:-18086}:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://reader-db:3306/reader_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
      DB_USER: reader
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      reader-db:
        condition: service_healthy
    networks: [backend]
  book-db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: book_db
      MYSQL_USER: book
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - book_data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  book-service:
    image: library-book:week06
    build: ./services/book-service
    ports:
      - "${BOOK_PORT:-18087}:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://book-db:3306/book_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
      DB_USER: book
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      book-db:
        condition: service_healthy
    networks: [backend]
  loan-db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: loan_db
      MYSQL_USER: loan
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - loan_data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  loan-service:
    image: library-loan:week06
    build: ./services/loan-service
    ports:
      - "${LOAN_PORT:-18088}:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://loan-db:3306/loan_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
      DB_USER: loan
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      READER_SERVICE_URL: http://reader-service:8080
      BOOK_SERVICE_URL: http://book-service:8080
      CONNECT_TIMEOUT_MS: 2000
      READ_TIMEOUT_MS: 3000
    depends_on:
      loan-db:
        condition: service_healthy
    networks: [backend]
volumes:
  reader_data:
  book_data:
  loan_data:
networks:
  backend:
